<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revdash</title>
<style>
  :root {
    --bg: #14171a;
    --bg-panel: #1c2024;
    --ledger-line: #2a2f34;
    --ink: #e8e6df;
    --ink-dim: #8a8f96;
    --money: #39ff6a;
    --money-dim: #1c9e42;
    --money-bright: #7fffb0;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --serif: 'IBM Plex Serif', Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  header {
    padding: 2.5rem 3rem 1.5rem;
    border-bottom: 1px solid var(--ledger-line);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--money-dim);
    margin: 0 0 0.75rem;
  }

  .total-figure {
    font-family: var(--mono);
    font-size: clamp(3.5rem, 9vw, 7rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--money);
    text-shadow: 0 0 12px rgba(57, 255, 106, 0.55), 0 0 32px rgba(57, 255, 106, 0.25);
    margin: 0;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }

  .total-figure .cents {
    font-size: 0.4em;
    color: var(--ink-dim);
  }

  .as-of {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--ink-dim);
    margin-top: 0.75rem;
  }

  main {
    flex: 1;
    padding: 2.5rem 3rem;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 2.5rem;
    align-items: start;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--ledger-line);
    border-radius: 4px;
    padding: 1.75rem;
  }

  .panel h2 {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--money);
    margin: 0 0 1.25rem;
    font-weight: 500;
  }

  .source-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--ledger-line);
  }

  .source-row:last-child { border-bottom: none; }

  .source-name {
    font-size: 1rem;
    color: var(--ink);
  }

  .source-type {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-left: 0.6rem;
  }

  .source-amount {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--money-bright);
    text-shadow: 0 0 8px rgba(127, 255, 176, 0.5);
  }

  .empty-state {
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--ink-dim);
    line-height: 1.6;
    padding: 1rem 0;
  }

  .empty-state .prompt {
    color: var(--money);
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 1.25rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--ledger-line);
  }

  .add-form input, .add-form select {
    background: var(--bg);
    border: 1px solid var(--ledger-line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.6rem 0.7rem;
    border-radius: 3px;
  }

  .add-form button {
    background: var(--money);
    color: #0a0d0a;
    border: none;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.7rem;
    border-radius: 3px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 0 16px rgba(57, 255, 106, 0.45);
  }

  .add-form button:hover {
    background: #7fffb0;
    box-shadow: 0 0 24px rgba(127, 255, 176, 0.65);
  }

  #trend-chart {
    width: 100%;
    height: 140px;
  }

  footer {
    border-top: 1px solid var(--ledger-line);
    background: var(--bg-panel);
    padding: 0.9rem 0;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }

  .ticker-track {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink-dim);
    padding-left: 100%;
    animation: scroll-left 40s linear infinite;
  }

  .ticker-track span.tick-amount {
    color: var(--money-bright);
  }

  .ticker-track span.tick-sep {
    color: var(--money-dim);
    margin: 0 1.5rem;
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; padding-left: 1rem; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Revdash &mdash; Live Ledger</p>
  <h1 class="total-figure" id="total-figure">$<span id="total-int">0</span><span class="cents">.<span id="total-cents">00</span></span></h1>
  <p class="as-of" id="as-of">Awaiting first entry</p>
</header>

<main>
  <div class="panel">
    <h2>By Source</h2>
    <div id="sources-list">
      <div class="empty-state">
        No income recorded yet. <span class="prompt">&gt;</span> Add a source below once something ships.
      </div>
    </div>

    <div class="add-form">
      <input type="text" id="f-name" placeholder="Source name (e.g. MyApp)">
      <select id="f-type">
        <option value="app">App</option>
        <option value="website">Website</option>
        <option value="service">Service</option>
        <option value="other">Other</option>
      </select>
      <input type="number" step="0.01" id="f-amount" placeholder="Amount (USD)">
      <input type="date" id="f-date">
      <button onclick="addEntry()">Log Income</button>
    </div>
  </div>

  <div class="panel">
    <h2>Last 30 Days</h2>
    <svg id="trend-chart" viewBox="0 0 400 140" preserveAspectRatio="none"></svg>
  </div>
</main>

<footer>
  <div class="ticker-track" id="ticker">Waiting for the first sale to hit the ledger&hellip;</div>
</footer>

<script>
async function fetchSummary() {
  const res = await fetch('/api/summary');
  return res.json();
}

function fmtMoney(n) {
  const parts = Math.abs(n).toFixed(2).split('.');
  const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return { int: intPart, cents: parts[1] };
}

function renderSources(bySource) {
  const el = document.getElementById('sources-list');
  if (!bySource.length) {
    el.innerHTML = '<div class="empty-state">No income recorded yet. <span class="prompt">&gt;</span> Add a source below once something ships.</div>';
    return;
  }
  el.innerHTML = bySource.map(s => `
    <div class="source-row">
      <div>
        <span class="source-name">${s.source_name}</span>
        <span class="source-type">${s.source_type}</span>
      </div>
      <div class="source-amount">$${s.total.toFixed(2)}</div>
    </div>
  `).join('');
}

function renderTrend(daily) {
  const svg = document.getElementById('trend-chart');
  if (!daily.length) {
    svg.innerHTML = '<text x="10" y="75" fill="#8a8f96" font-family="monospace" font-size="12">No data yet</text>';
    return;
  }
  const max = Math.max(...daily.map(d => d.total), 1);
  const w = 400, h = 140, pad = 10;
  const stepX = (w - pad * 2) / Math.max(daily.length - 1, 1);
  const points = daily.map((d, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (d.total / max) * (h - pad * 2);
    return `${x},${y}`;
  }).join(' ');
  const areaPoints = `${pad},${h - pad} ${points} ${w - pad},${h - pad}`;
  svg.innerHTML = `
    <polygon points="${areaPoints}" fill="#39ff6a" opacity="0.12"></polygon>
    <polyline points="${points}" fill="none" stroke="#39ff6a" stroke-width="2"></polyline>
  `;
}

function renderTicker(bySource) {
  const el = document.getElementById('ticker');
  if (!bySource.length) return;
  const parts = bySource.map(s =>
    `${s.source_name} <span class="tick-amount">$${s.total.toFixed(2)}</span>`
  );
  el.innerHTML = parts.join('<span class="tick-sep">&bull;</span>') +
    '<span class="tick-sep">&bull;</span>' + parts.join('<span class="tick-sep">&bull;</span>');
}

async function refresh() {
  const data = await fetchSummary();
  const { int, cents } = fmtMoney(data.total);
  document.getElementById('total-int').textContent = int;
  document.getElementById('total-cents').textContent = cents;
  document.getElementById('as-of').textContent =
    'Updated ' + new Date(data.generated_at).toLocaleString();
  renderSources(data.by_source);
  renderTrend(data.daily_last_30);
  renderTicker(data.by_source);
}

async function addEntry() {
  const name = document.getElementById('f-name').value.trim();
  const type = document.getElementById('f-type').value;
  const amount = document.getElementById('f-amount').value;
  const date = document.getElementById('f-date').value;
  if (!name || !amount) return;

  await fetch('/api/income', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      source_name: name,
      source_type: type,
      amount: amount,
      entry_date: date || undefined,
    }),
  });

  document.getElementById('f-name').value = '';
  document.getElementById('f-amount').value = '';
  refresh();
}

document.getElementById('f-date').valueAsDate = new Date();
refresh();
setInterval(refresh, 30000);
</script>

</body>
</html>
